name: CI and Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  ci:
    name: Build and verify runtime and VS Code extension
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Restore official LLVM archive cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/linux-release-deps/llvm/22.1.8
            .cache/linux-release-deps/downloads/LLVM-22.1.8-Linux-X64.tar.xz
          key: llvm-22.1.8-linux-x64-${{ hashFiles('cmake/LLVMDistribution.cmake') }}
      - name: Verify build tools
        run: |
          cmake --version
          ninja --version
          git --version
      - name: Build, test, stage and audit release
        run: tools/release-linux.sh
      - name: Validate release version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(build/CI/bin/recurloop --version | sed -n 's/^Recurloop v//p')" = "${TAG#v}"
      - name: Set up Node.js for the VS Code extension
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/vscode-recurloop/package-lock.json
      - name: Build and stage the VS Code release asset
        shell: bash
        run: |
          set -euo pipefail
          make vscode-extension
          extension_version="$(node -p "require('./tools/vscode-recurloop/package.json').version")"
          asset="recurloop-vscode-${extension_version}.vsix"
          cp "tools/vscode-recurloop/$asset" dist/
          (cd dist && sha256sum "$asset" > "$asset.sha256")
      - name: Verify extension runtime, navigation and debugger integration
        env:
          RECURLOOP_TEST_PROGRAM: ${{ github.workspace }}/build/CI/bin/recurloop
          RECURLOOP_TEST_LIBRARIES: ${{ github.workspace }}/build/CI/libraries
        shell: bash
        run: |
          set -euo pipefail
          llvm_sdk="$(cat .cache/linux-release-deps/llvm-sdk-path.txt)"
          export PATH="$llvm_sdk/bin:$PATH"
          npm test --prefix tools/vscode-recurloop
      - uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: Clean runtime on ${{ matrix.image }}
    needs: ci
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [debian:12-slim, debian:13-slim, ubuntu:22.04, ubuntu:24.04, ubuntu:26.04, fedora:44]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: dist
      - name: Exercise relocated package without compiler, network or dependency cache
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find dist -maxdepth 1 -type f -name 'recurloop-*-linux-x86_64.tar.gz' -print | sort)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          package_root="$(tar -tzf "$archive" | sed -n '1{s,/.*,,;p;}')"
          test -n "$package_root"
          mkdir -p 'relocated package'
          tar -xzf "$archive" -C 'relocated package'
          docker run --rm --network none \
            -v "$PWD/relocated package:/opt/relocated package:ro" \
            -v "$PWD/tools/smoke-installed.sh:/smoke.sh:ro" \
            '${{ matrix.image }}' sh /smoke.sh "/opt/relocated package/$package_root"

  release:
    name: Publish verified GitHub Release
    needs: [ci, compatibility]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "RecurLoop ${GITHUB_REF_NAME}" --generate-notes
