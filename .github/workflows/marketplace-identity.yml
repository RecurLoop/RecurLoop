name: Marketplace identity setup

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  identity:
    name: Read the Marketplace profile ID for publisher membership
    runs-on: ubuntu-24.04
    environment: vscode-marketplace
    steps:
      - name: Sign in to Microsoft Entra ID using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Show the identity to add to the recurloop publisher
        shell: bash
        run: |
          set -euo pipefail
          profile_id="$(az rest --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id --output tsv)"
          test -n "$profile_id"
          echo "Marketplace profile ID: $profile_id"
          {
            echo 'Add this profile ID to publisher **recurloop** with the **Contributor** role:'
            echo
            echo "\`$profile_id\`"
          } >> "$GITHUB_STEP_SUMMARY"
